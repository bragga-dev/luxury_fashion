# luxury_fashion/docker-compose.prod.yml
services:
  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn luxury_fashion.config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Sem isto wsgi.py/celery.py/manage.py caem no default (settings.dev): em produção rodaria com
      # tokens de 90h, CORS de dev e sem HTTPS/HSTS.
      DJANGO_SETTINGS_MODULE: luxury_fashion.config.settings.prod
    healthcheck:
      # Bate em /health/live (isento do redirect HTTPS) mandando o 1º host de ALLOWED_HOSTS no header Host.
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request as u; h = os.environ['ALLOWED_HOSTS'].split(',')[0].strip().lstrip('.'); u.urlopen(u.Request('http://127.0.0.1:8000/health/live', headers={'Host': h}), timeout=4)"
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 60s   # migrate + collectstatic rodam antes do gunicorn subir
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-luxury_fashion}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always

  celery:
    build: .
    command: celery -A luxury_fashion.config worker -l info --concurrency 4
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: luxury_fashion.config.settings.prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy

  celery-beat:
    build: .
    command: celery -A luxury_fashion.config beat -l info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: luxury_fashion.config.settings.prod
    restart: always
    depends_on:
      - redis

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${MINIO_BUCKET_MEDIA:-beautyformulamedia};
      mc mb --ignore-existing local/${MINIO_BUCKET_STATIC:-beautyformulastatic};
      mc anonymous set download local/${MINIO_BUCKET_STATIC:-beautyformulastatic};
      exit 0;
      "
    env_file: .env

volumes:
  postgres_data:
  minio_data: